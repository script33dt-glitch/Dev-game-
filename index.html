<!DOCTYPE html>
<html lang="pt-BR" data-theme="dracula">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Typist Pro - Dark Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* VARIABLES DE TEMAS ESCUROS E ROXOS */
    :root[data-theme="dracula"] {
      --bg-base: #282a36;
      --bg-panel: #21222c;
      --bg-input: #191a21;
      --accent: #bd93f9;
      --accent-glow: rgba(189, 147, 249, 0.4);
      --secondary: #ff79c6;
      --text-main: #f8f8f2;
      --text-muted: #6272a4;
      --border: #44475a;
      --editor-cursor: #ff79c6;
    }

    :root[data-theme="vscode"] {
      --bg-base: #1e1e1e;
      --bg-panel: #252526;
      --bg-input: #111111;
      --accent: #007acc;
      --accent-glow: rgba(0, 122, 204, 0.4);
      --secondary: #c586c0;
      --text-main: #d4d4d4;
      --text-muted: #858585;
      --border: #3c3c3c;
      --editor-cursor: #007acc;
    }

    :root[data-theme="cyberpunk"] {
      --bg-base: #0d0f18;
      --bg-panel: #16192b;
      --bg-input: #080a10;
      --accent: #e000ff;
      --accent-glow: rgba(224, 0, 255, 0.5);
      --secondary: #00f0ff;
      --text-main: #ffffff;
      --text-muted: #6b729c;
      --border: #32235e;
      --editor-cursor: #00f0ff;
    }

    :root[data-theme="synthwave"] {
      --bg-base: #1a0933;
      --bg-panel: #261147;
      --bg-input: #120424;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.5);
      --secondary: #ff9900;
      --text-main: #f0e6ff;
      --text-muted: #7957a8;
      --border: #4a2180;
      --editor-cursor: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      background-color: var(--bg-panel);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, button {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    select:hover, button:hover { border-color: var(--accent); }

    .game-container {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-right { border-right: none; border-left: 1px solid var(--border); }

    .stat-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
    }

    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .stat-value { font-family: 'Fira Code', monospace; font-size: 1.5rem; font-weight: 700; color: var(--accent); margin-top: 4px; }

    .editor-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-base);
    }

    .terminal-window {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .terminal-header {
      background: var(--bg-panel);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }

    .terminal-title { margin-left: 10px; font-family: 'Fira Code', monospace; font-size: 0.8rem; color: var(--text-muted); }

    .editor-body {
      padding: 20px;
      font-family: 'Fira Code', monospace;
      font-size: 1.1rem;
      line-height: 1.6;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .code-display {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .char-typed { color: var(--secondary); font-weight: bold; }
    .char-untyped { color: var(--text-muted); opacity: 0.6; }
    .char-current { background-color: var(--accent); color: var(--bg-base); animation: blink 1s infinite; }

    @keyframes blink { 50% { opacity: 0.5; } }

    .typing-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .multiplier-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .btn-mult {
      flex: 1;
      padding: 6px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .btn-mult.active {
      background: var(--accent);
      color: var(--bg-base);
      border-color: var(--accent);
    }

    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 160px);
    }

    .shop-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shop-item.disabled { opacity: 0.5; cursor: not-allowed; }
    .shop-info h4 { font-size: 0.9rem; color: var(--text-main); }
    .shop-info p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .shop-btn { background: var(--accent); color: var(--bg-base); font-weight: bold; border: none; }

    .badge {
      background: var(--accent-glow);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">&lt;DEV_TYPIST_PRO/&gt;</div>
    <div class="controls-group">
      <select id="langSelect">
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <select id="themeSelect">
        <option value="dracula">💜 Dracula Purple</option>
        <option value="vscode">🖤 VS Code Dark</option>
        <option value="cyberpunk">⚡ Cyberpunk</option>
        <option value="synthwave">🔮 Synthwave '84</option>
      </select>
      <button id="bgmBtn">🎵 Focus Audio: OFF</button>
    </div>
  </header>

  <div class="game-container">
    <!-- ESTATÍSTICAS -->
    <div class="panel">
      <div class="stat-card">
        <div class="stat-label" id="lblLoc">Linhas de Código (LOC)</div>
        <div class="stat-value" id="valLoc">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" id="lblCps">LOC por Segundo (CPS)</div>
        <div class="stat-value" id="valCps">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" id="lblStreak">Combo de Digitação</div>
        <div class="stat-value" id="valStreak">x1.0</div>
      </div>
    </div>

    <!-- ÁREA DE DIGITAÇÃO -->
    <div class="editor-section">
      <div class="terminal-window" onclick="focusInput()">
        <div class="terminal-header">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
          <span class="terminal-title">workspace.js — Auto-Focus Active</span>
        </div>
        <div class="editor-body">
          <div class="code-display" id="codeDisplay"></div>
          <input type="text" class="typing-input" id="hiddenInput" autofocus autocomplete="off">
        </div>
      </div>
    </div>

    <!-- LOJA DE UPGRADES -->
    <div class="panel panel-right">
      <h3 id="lblShopTitle">Loja de Automações</h3>
      <div class="multiplier-selector">
        <button class="btn-mult active" onclick="setBuyAmount('1')">x1</button>
        <button class="btn-mult" onclick="setBuyAmount('10')">x10</button>
        <button class="btn-mult" onclick="setBuyAmount('100')">x100</button>
        <button class="btn-mult" onclick="setBuyAmount('MAX')">MAX</button>
      </div>
      <div class="shop-list" id="shopList"></div>
    </div>
  </div>

  <script>
    // DICIONÁRIO DE TRADUÇÕES
    const I18N = {
      pt: {
        lblLoc: "Linhas de Código (LOC)",
        lblCps: "LOC por Segundo (CPS)",
        lblStreak: "Combo de Digitação",
        lblShopTitle: "Loja de Automações",
        bgmOff: "🎵 Áudio Foco: OFF",
        bgmOn: "🎵 Áudio Foco: ON",
        items: [
          { name: "Script Auto-Complete", desc: "Ajuda na digitação automática" },
          { name: "Estagiário de Dev", desc: "Gera linhas básicas por segundo" },
          { name: "Dev Fullstack", desc: "Desenvolve serviços contínuos" },
          { name: "Servidor em Nuvem", desc: "Infraestrutura escalável para LOC" },
          { name: "IA Copilot", desc: "Algoritmos neurais que codificam sós" }
        ]
      },
      en: {
        lblLoc: "Lines of Code (LOC)",
        lblCps: "LOC per Second (CPS)",
        lblStreak: "Typing Streak",
        lblShopTitle: "Automation Shop",
        bgmOff: "🎵 Focus Audio: OFF",
        bgmOn: "🎵 Focus Audio: ON",
        items: [
          { name: "Auto-Complete Script", desc: "Assists with automatic code" },
          { name: "Dev Intern", desc: "Generates basic lines per second" },
          { name: "Fullstack Dev", desc: "Builds continuous services" },
          { name: "Cloud Server", desc: "Scalable infrastructure for LOC" },
          { name: "Copilot AI", desc: "Neural networks coding autonomously" }
        ]
      },
      es: {
        lblLoc: "Líneas de Código (LOC)",
        lblCps: "LOC por Segundo (CPS)",
        lblStreak: "Combo de Escritura",
        lblShopTitle: "Tienda de Automatización",
        bgmOff: "🎵 Audio Enfoque: OFF",
        bgmOn: "🎵 Audio Enfoque: ON",
        items: [
          { name: "Script Auto-Completar", desc: "Ayuda con código automático" },
          { name: "Pasante de Dev", desc: "Genera líneas básicas por segundo" },
          { name: "Dev Fullstack", desc: "Desarrolla servicios continuos" },
          { name: "Servidor en la Nube", desc: "Infraestructura escalable" },
          { name: "IA Copiloto", desc: "Redes neuronales que programan solas" }
        ]
      }
    };

    // SNIPPETS DE CÓDIGO (SEMPRE EM INGLÊS)
    const CODE_SNIPPETS = [
      "const app = express();",
      "function calculateTotal(items) { return items.reduce((a, b) => a + b, 0); }",
      "import React, { useState, useEffect } from 'react';",
      "document.addEventListener('DOMContentLoaded', () => { initGame(); });",
      "async function fetchData(url) { const res = await fetch(url); return res.json(); }",
      "export const useAuth = () => useContext(AuthContext);",
      "let activeNodes = cluster.workers.filter(w => w.isConnected());"
    ];

    // ESTADO DO JOGO
    let loc = 0;
    let cps = 0;
    let streak = 1.0;
    let currentLang = 'pt';
    let buyAmount = '1';
    let currentSnippet = '';
    let typedIndex = 0;

    let items = [
      { id: 0, baseCost: 15, cps: 0.5, count: 0 },
      { id: 1, baseCost: 100, cps: 4, count: 0 },
      { id: 2, baseCost: 1100, cps: 32, count: 0 },
      { id: 3, baseCost: 12000, cps: 260, count: 0 },
      { id: 4, baseCost: 130000, cps: 1400, count: 0 }
    ];

    // INICIALIZAÇÃO
    const hiddenInput = document.getElementById('hiddenInput');
    const codeDisplay = document.getElementById('codeDisplay');

    function init() {
      newSnippet();
      updateShopUI();
      focusInput();
      
      // Loop principal (CPS)
      setInterval(() => {
        loc += cps / 10;
        updateUI();
      }, 100);

      // Eventos
      document.getElementById('langSelect').addEventListener('change', (e) => {
        currentLang = e.target.value;
        updateLanguage();
      });

      document.getElementById('themeSelect').addEventListener('change', (e) => {
        document.documentElement.setAttribute('data-theme', e.target.value);
      });

      hiddenInput.addEventListener('input', handleTyping);
      document.addEventListener('click', focusInput);
    }

    function focusInput() {
      hiddenInput.focus();
    }

    function newSnippet() {
      currentSnippet = CODE_SNIPPETS[Math.floor(Math.random() * CODE_SNIPPETS.length)];
      typedIndex = 0;
      hiddenInput.value = '';
      renderCode();
    }

    function renderCode() {
      let html = '';
      for (let i = 0; i < currentSnippet.length; i++) {
        if (i < typedIndex) {
          html += `<span class="char-typed">${currentSnippet[i]}</span>`;
        } else if (i === typedIndex) {
          html += `<span class="char-current">${currentSnippet[i]}</span>`;
        } else {
          html += `<span class="char-untyped">${currentSnippet[i]}</span>`;
        }
      }
      codeDisplay.innerHTML = html;
    }

    function handleTyping() {
      const val = hiddenInput.value;
      const expectedChar = currentSnippet[typedIndex];
      const typedChar = val[val.length - 1];

      if (typedChar === expectedChar) {
        typedIndex++;
        loc += 1 * streak;
        streak = Math.min(5.0, streak + 0.05);
        playKeySound();

        if (typedIndex >= currentSnippet.length) {
          loc += 25 * streak;
          newSnippet();
        } else {
          renderCode();
        }
      } else {
        streak = 1.0;
      }
      hiddenInput.value = '';
      updateUI();
    }

    function updateUI() {
      document.getElementById('valLoc').innerText = Math.floor(loc).toLocaleString();
      document.getElementById('valCps').innerText = cps.toFixed(1);
      document.getElementById('valStreak').innerText = `x${streak.toFixed(2)}`;
      updateShopUI();
    }

    function updateLanguage() {
      const texts = I18N[currentLang];
      document.getElementById('lblLoc').innerText = texts.lblLoc;
      document.getElementById('lblCps').innerText = texts.lblCps;
      document.getElementById('lblStreak').innerText = texts.lblStreak;
      document.getElementById('lblShopTitle').innerText = texts.lblShopTitle;
      updateShopUI();
    }

    function setBuyAmount(amount) {
      buyAmount = amount;
      document.querySelectorAll('.btn-mult').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      updateShopUI();
    }

    function getItemCost(item, quantity) {
      let totalCost = 0;
      for (let i = 0; i < quantity; i++) {
        totalCost += Math.floor(item.baseCost * Math.pow(1.15, item.count + i));
      }
      return totalCost;
    }

    function buyItem(id) {
      const item = items[id];
      let qty = 1;
      
      if (buyAmount === '10') qty = 10;
      if (buyAmount === '100') qty = 100;
      if (buyAmount === 'MAX') {
        qty = 0;
        while (loc >= getItemCost(item, qty + 1)) {
          qty++;
        }
      }

      const cost = getItemCost(item, qty);
      if (qty > 0 && loc >= cost) {
        loc -= cost;
        item.count += qty;
        recalculateCPS();
        updateUI();
      }
    }

    function recalculateCPS() {
      cps = items.reduce((acc, item) => acc + (item.count * item.cps), 0);
    }

    function updateShopUI() {
      const shopContainer = document.getElementById('shopList');
      const texts = I18N[currentLang];
      
      shopContainer.innerHTML = '';
      items.forEach((item, index) => {
        let qtyToBuy = buyAmount === 'MAX' ? 1 : parseInt(buyAmount);
        let cost = getItemCost(item, qtyToBuy);
        const canAfford = loc >= cost;

        const div = document.createElement('div');
        div.className = `shop-item ${canAfford ? '' : 'disabled'}`;
        div.innerHTML = `
          <div class="shop-info">
            <h4>${texts.items[index].name} <span class="badge">x${item.count}</span></h4>
            <p>${texts.items[index].desc}</p>
            <p style="color: var(--accent); margin-top:4px; font-weight:bold;">LOC: ${cost.toLocaleString()}</p>
          </div>
          <button class="shop-btn" onclick="buyItem(${index})">+${buyAmount}</button>
        `;
        shopContainer.appendChild(div);
      });
    }

    // SOM SIMPLES DE TECLA (SINTETIZADO)
    function playKeySound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300 + Math.random() * 150, ctx.currentTime);
        gain.gain.setValueAtTime(0.02, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    window.onload = init;
  </script>
</body>
</html>
